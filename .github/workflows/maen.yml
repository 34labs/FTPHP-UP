name: Deploy to SFTP

# This workflow triggers automatically on every push to the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    # Use the latest Ubuntu runner provided by GitHub
    runs-on: ubuntu-latest
    steps:
      # Step 1: Download the repository code to the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Upload files to the server using SFTP
      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          # Server credentials stored securely in GitHub Secrets
          username: ${{ secrets.SFTP_USER }}
          server: ${{ secrets.SFTP_SERVER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          
          # Deployment settings
          sftp_only: true 
          local_path: './public_html/*' # Source folder in the repository
          remote_path: './public_html'   # Destination folder on the server
